<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票 Agent · Building Block 01</title>
<style>
  :root{
    --bg:#F7F8FA; --card:#FFFFFF; --ink:#16191D; --ink2:#5A626C; --ink3:#8B93A1;
    --line:#E3E6EB; --line2:#EDEFF3;
    --blue:#185FA5; --blue-50:#E6F1FB; --blue-200:#85B7EB;
    --teal:#0F6E56; --teal-50:#E1F5EE;
    --up:#C0392B;      /* 涨 = 红 */
    --down:#1D9E75;    /* 跌 = 绿 */
    --amber:#854F0B; --amber-50:#FAEEDA;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .layout{display:flex; height:100vh; overflow:hidden}

  /* ---------- 侧栏 ---------- */
  aside{
    width:300px; flex:none; background:var(--card); border-right:.5px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .brand{padding:22px 22px 18px; border-bottom:.5px solid var(--line2)}
  .brand h1{font-size:16px; font-weight:600; letter-spacing:-.01em}
  .brand p{font-size:12.5px; color:var(--ink3); margin-top:4px}
  .mode{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    font-size:12px; padding:4px 10px; border-radius:999px; font-weight:500;
  }
  .mode.mock{background:var(--amber-50); color:var(--amber); border:.5px solid #FAC775}
  .mode.live{background:var(--teal-50); color:var(--teal); border:.5px solid #9FE1CB}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  .panel{padding:18px 22px; border-bottom:.5px solid var(--line2)}
  .panel h2{font-size:12px; font-weight:600; color:var(--ink3); letter-spacing:.05em; margin-bottom:12px}
  .tool{background:var(--blue-50); border-radius:8px; padding:10px 12px; margin-bottom:8px}
  .tool code{font-family:var(--mono); font-size:12.5px; color:var(--blue); font-weight:500}
  .tool p{font-size:12px; color:var(--ink2); margin-top:3px; line-height:1.5}
  .tool .params{font-family:var(--mono); font-size:11.5px; color:var(--ink3); margin-top:5px}
  .kv{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:var(--ink2)}
  .kv b{font-weight:500; color:var(--ink)}

  .chips{padding:18px 22px; display:flex; flex-direction:column; gap:7px}
  .chips h2{font-size:12px; font-weight:600; color:var(--ink3); letter-spacing:.05em; margin-bottom:5px}
  .chip{
    text-align:left; font-size:13px; font-family:inherit; color:var(--ink2); cursor:pointer;
    background:var(--card); border:.5px solid var(--line); border-radius:8px; padding:8px 11px;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--blue-200); color:var(--blue); background:var(--blue-50)}
  .aside-foot{margin-top:auto; padding:16px 22px}
  .btn-reset{
    width:100%; font-family:inherit; font-size:13px; color:var(--ink2); cursor:pointer;
    background:transparent; border:.5px solid var(--line); border-radius:8px; padding:8px;
  }
  .btn-reset:hover{border-color:#C3C8D0; color:var(--ink)}

  /* ---------- 主区 ---------- */
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  .scroll{flex:1; overflow-y:auto; padding:32px 0}
  .inner{max-width:760px; margin:0 auto; padding:0 28px}

  .empty{text-align:center; padding:64px 0; color:var(--ink3)}
  .empty .big{font-size:17px; font-weight:600; color:var(--ink); margin-bottom:8px}
  .empty p{font-size:14px; max-width:420px; margin:0 auto}

  .msg{margin-bottom:26px; display:flex; flex-direction:column}
  .msg.user{align-items:flex-end}
  .bubble{
    max-width:82%; padding:11px 16px; border-radius:14px; font-size:14.5px;
    white-space:pre-wrap; word-break:break-word;
  }
  .msg.user .bubble{background:var(--blue); color:#fff; border-bottom-right-radius:5px}
  .msg.bot .bubble{background:var(--card); border:.5px solid var(--line); border-bottom-left-radius:5px}

  .trace{margin-top:10px; max-width:88%}
  .trace-head{
    display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink3);
    cursor:pointer; user-select:none; padding:3px 0;
  }
  .trace-head:hover{color:var(--blue)}
  .trace-head .caret{font-size:10px; transition:transform .18s; display:inline-block}
  .trace.open .caret{transform:rotate(90deg)}
  .steps{margin-top:8px; display:none}
  .trace.open .steps{display:block}
  .step{
    background:var(--card); border:.5px solid var(--line); border-left:2.5px solid var(--teal);
    border-radius:9px; padding:11px 14px; margin-bottom:8px;
  }
  .step-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .step .n{
    font-family:var(--mono); font-size:11px; color:#fff; background:var(--teal);
    border-radius:4px; padding:1px 6px;
  }
  .step code{font-family:var(--mono); font-size:13px; color:var(--teal); font-weight:500}
  .step .args{font-family:var(--mono); font-size:12px; color:var(--ink2)}
  .step pre{
    font-family:var(--mono); font-size:12px; color:var(--ink2); background:#F5F7FA;
    border-radius:6px; padding:9px 11px; margin-top:9px; overflow-x:auto; white-space:pre-wrap;
    word-break:break-word; line-height:1.6;
  }
  .step .lab{font-size:11px; color:var(--ink3); letter-spacing:.04em; margin-top:9px}

  .loading{display:flex; gap:5px; padding:14px 4px}
  .loading i{width:7px;height:7px;border-radius:50%;background:#C3C8D0;animation:bounce 1.2s infinite}
  .loading i:nth-child(2){animation-delay:.15s}
  .loading i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  .composer{border-top:.5px solid var(--line); background:var(--card); padding:16px 0 20px}
  .composer .inner{display:flex; gap:10px; align-items:flex-end}
  textarea{
    flex:1; resize:none; font-family:inherit; font-size:14.5px; line-height:1.6;
    color:var(--ink); background:var(--bg); border:.5px solid var(--line);
    border-radius:12px; padding:11px 14px; outline:none; max-height:150px;
  }
  textarea:focus{border-color:var(--blue-200); background:var(--card)}
  .send{
    flex:none; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;
    color:#fff; background:var(--blue); border:none; border-radius:12px; padding:12px 20px;
    transition:opacity .15s;
  }
  .send:hover{opacity:.88}
  .send:disabled{opacity:.4; cursor:not-allowed}
  .hint{font-size:11.5px; color:var(--ink3); margin-top:9px}

  @media (max-width:820px){
    aside{display:none}
    .inner{padding:0 18px}
  }
</style>
</head>
<body>
<div class="layout">

  <aside>
    <div class="brand">
      <h1>股票 Agent</h1>
      <p>Building Block 01 · 单块跑通</p>
      <div class="mode mock" id="modeBadge"><span class="dot"></span><span id="modeText">读取中…</span></div>
    </div>

    <div class="panel">
      <h2>块里挂了什么工具</h2>
      <div id="toolList"></div>
    </div>

    <div class="panel">
      <h2>循环参数</h2>
      <div class="kv"><span>步数上限</span><b id="cfgSteps">—</b></div>
      <div class="kv"><span>记忆保留</span><b id="cfgTurns">—</b></div>
      <div class="kv"><span>三个增强</span><b>Tools · Retrieval · Memory</b></div>
    </div>

    <div class="chips">
      <h2>试试这样问</h2>
      <button class="chip" data-q="贵州茅台现在多少钱？">贵州茅台现在多少钱？</button>
      <button class="chip" data-q="宁德时代最近10个交易日走势怎么样？">宁德时代最近10个交易日走势怎么样？</button>
      <button class="chip" data-q="招商银行和中国平安今天涨跌对比">招商银行和中国平安今天涨跌对比</button>
      <button class="chip" data-q="比亚迪的主营业务和主要风险是什么？">比亚迪的主营业务和风险？</button>
      <button class="chip" data-q="帮我看看英伟达现在的估值水平">英伟达现在估值高吗？</button>
      <button class="chip" data-q="还记得我上一个问题问的是哪只股票吗？">考一下记忆：我上一句问了啥？</button>
    </div>

    <div class="aside-foot">
      <button class="btn-reset" id="resetBtn">清空对话与记忆</button>
    </div>
  </aside>

  <main>
    <div class="scroll" id="scroll">
      <div class="inner" id="messages">
        <div class="empty">
          <div class="big">这个块只做一件事</div>
          <p>把问题 + 工具清单交给模型，模型决定调哪个工具，执行完把结果写回上下文，再回答你。所有工具调用都会摊开给你看。</p>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="inner">
        <textarea id="input" rows="1" placeholder="问一只股票的价格、走势或基本面…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="inner"><div class="hint" id="hint">所有数据来自公开行情接口，仅供学习，不构成投资建议。</div></div>
    </div>
  </main>

</div>

<script>
(function () {
  var SID_KEY = 'stock-agent-session';
  var sid = localStorage.getItem(SID_KEY);
  if (!sid) { sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem(SID_KEY, sid); }

  var messagesEl = document.getElementById('messages');
  var scrollEl = document.getElementById('scroll');
  var inputEl = document.getElementById('input');
  var sendEl = document.getElementById('send');
  var busy = false;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function scrollDown() { scrollEl.scrollTop = scrollEl.scrollHeight; }

  // 数字上色：涨红跌绿（A 股习惯）
  function tint(text) {
    return esc(text).replace(/(-?\d+\.\d+)%/g, function (m, n) {
      var cls = parseFloat(n) >= 0 ? 'up' : 'down';
      return '<span class="' + cls + '" style="color:var(--' + cls + ');font-weight:500">' + m + '</span>';
    });
  }

  function clearEmpty() {
    var e = messagesEl.querySelector('.empty');
    if (e) e.remove();
  }

  function addUser(text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg user';
    d.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
    messagesEl.appendChild(d);
    scrollDown();
  }

  function addLoading() {
    var d = document.createElement('div');
    d.className = 'msg bot';
    d.id = 'loadingMsg';
    d.innerHTML = '<div class="loading"><i></i><i></i><i></i></div>';
    messagesEl.appendChild(d);
    scrollDown();
    return d;
  }

  function renderStep(step, idx) {
    var args = JSON.stringify(step.arguments || {});
    var res = JSON.stringify(step.result, null, 2);
    if (res && res.length > 900) res = res.slice(0, 900) + '\n…（已截断）';
    return '<div class="step">'
      + '<div class="step-top"><span class="n">' + idx + '</span>'
      + '<code>' + esc(step.name) + '</code>'
      + '<span class="args">' + esc(args) + '</span></div>'
      + '<div class="lab">工具返回</div>'
      + '<pre>' + esc(res) + '</pre>'
      + '</div>';
  }

  function addBot(reply, trace, steps) {
    var d = document.createElement('div');
    d.className = 'msg bot';
    var html = '<div class="bubble">' + tint(reply) + '</div>';

    if (trace && trace.length) {
      var inner = trace.map(function (s, i) { return renderStep(s, i + 1); }).join('');
      html += '<div class="trace" id="trace-' + Date.now() + '">'
        + '<div class="trace-head"><span class="caret">▶</span>'
        + '执行轨迹 · 共 ' + trace.length + ' 次工具调用 / ' + steps + ' 轮'
        + '</div><div class="steps">' + inner + '</div></div>';
    } else if (steps) {
      html += '<div class="trace"><div class="trace-head" style="cursor:default">'
        + '<span class="caret" style="visibility:hidden">▶</span>'
        + '直接回答 · 未调用任何工具（共 ' + steps + ' 轮）</div></div>';
    }

    d.innerHTML = html;
    var t = d.querySelector('.trace');
    if (t) {
      t.querySelector('.trace-head').addEventListener('click', function () { t.classList.toggle('open'); });
    }
    messagesEl.appendChild(d);
    scrollDown();
  }

  function addError(text) {
    var d = document.createElement('div');
    d.className = 'msg bot';
    d.innerHTML = '<div class="bubble" style="border-color:#F0997B;background:#FAECE7;color:#712B13">'
      + esc(text) + '</div>';
    messagesEl.appendChild(d);
    scrollDown();
  }

  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendEl.disabled = true;
    addUser(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    var load = addLoading();

    try {
      var r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, message: text })
      });
      var data = await r.json();
      load.remove();
      if (!r.ok && !data.reply) { addError('服务端返回 ' + r.status); }
      else { addBot(data.reply || '(空回复)', data.trace || [], data.steps || 0); }
    } catch (e) {
      load.remove();
      addError('请求失败：' + e.message + '（确认服务已启动，端口没被占用）');
    } finally {
      busy = false;
      sendEl.disabled = false;
      inputEl.focus();
    }
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
  }

  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
  });
  sendEl.addEventListener('click', function () { send(inputEl.value); });

  document.querySelectorAll('.chip').forEach(function (c) {
    c.addEventListener('click', function () { send(c.dataset.q); });
  });

  document.getElementById('resetBtn').addEventListener('click', async function () {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid })
    });
    messagesEl.innerHTML = '<div class="empty"><div class="big">记忆已清空</div>'
      + '<p>长期记忆里只保存了「用户问了什么、助手答了什么」，工具调用的原始返回从不进入记忆。</p></div>';
  });

  fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
    var badge = document.getElementById('modeBadge');
    badge.className = 'mode ' + cfg.mode;
    document.getElementById('modeText').textContent =
      cfg.mode === 'mock' ? 'Mock 模式 · 规则模拟决策' : ('真实模型 · ' + cfg.model);

    document.getElementById('cfgSteps').textContent = cfg.max_steps + ' 轮';
    document.getElementById('cfgTurns').textContent = '最近 ' + cfg.history_turns + ' 条';

    document.getElementById('toolList').innerHTML = cfg.tools.map(function (t) {
      return '<div class="tool"><code>' + esc(t.name) + '</code>'
        + '<p>' + esc(t.description) + '</p>'
        + '<div class="params">' + esc(t.params.join(', ')) + '</div></div>';
    }).join('');

    if (cfg.mode === 'mock') {
      document.getElementById('hint').textContent =
        '当前是 Mock 模式：没有真实的 LLM 在决策，而是用规则模拟了它的选择过程。设置 OPENAI_API_KEY 后会切换到真实模型。';
    }
  }).catch(function () {});

  inputEl.focus();
})();
</script>
</body>
</html>
